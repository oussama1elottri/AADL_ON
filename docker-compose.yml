services:
  db:
    image: postgres:15-alpine
    container_name: aadl_on_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aadl_on_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aadl_on_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/aadl_on_db}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - SEPOLIA_WEBSOCKET_RPC_URL=${SEPOLIA_WEBSOCKET_RPC_URL}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - SEPOLIA_PRIVATE_KEY=${SEPOLIA_PRIVATE_KEY}
      - OPERATOR_API_KEY=${OPERATOR_API_KEY:-government-secret-notary-key}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - db

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: aadl_on_indexer
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/aadl_on_db}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - SEPOLIA_WEBSOCKET_RPC_URL=${SEPOLIA_WEBSOCKET_RPC_URL}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
    depends_on:
      - db
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aadl_on_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
